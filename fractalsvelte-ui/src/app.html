<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f7f5f2" />
		<link rel="icon" href="/favicon.svg" />
		<script>
			(function () {
				try {
					var darkThemes = ['theme-lagoona-dark','theme-frozen-dark','theme-night-dark','theme-inkworm-dark','theme-monochrono-dark','theme-fouram-dark','theme-wintercame-dark','theme-sun-dark','theme-console-dark','theme-dracula-dark','theme-catppuccin-mocha','theme-nord-dark','theme-gruvbox-dark','theme-onedark-pro','theme-rose-pine-dark','theme-midnight-emerald-dark','theme-obsidian-crimson-dark','theme-synthwave-dark','theme-deep-ocean-dark','theme-amethyst-void-dark'];
					var savedTheme = localStorage.getItem('theme') || localStorage.getItem('fractalsvelte.theme-family') || 'theme-light-default';
					var savedBgStyle = localStorage.getItem('bgStyle') || 'plain';
					var validBgStyles = ['plain', 'aura', 'gradient', 'pattern'];
					if (validBgStyles.indexOf(savedBgStyle) === -1) savedBgStyle = 'plain';
					var isDark = darkThemes.indexOf(savedTheme) !== -1 || savedTheme.indexOf('-dark') !== -1 || savedTheme.indexOf('-mocha') !== -1 || localStorage.getItem('fractalsvelte.mode') === 'dark';
					var mode = isDark ? 'dark' : 'light';
					var root = document.documentElement;
					root.classList.add(savedTheme);
					root.setAttribute('data-theme', mode);
					root.setAttribute('data-mode', mode);
					root.setAttribute('data-theme-id', savedTheme);
					root.setAttribute('data-theme-family', savedTheme);
					root.setAttribute('data-bg-style', savedBgStyle);
					root.style.colorScheme = mode;
				} catch (_) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<script>
			(function () {
				try {
					var root = document.documentElement;
					var body = document.body;
					['data-theme', 'data-mode', 'data-theme-family', 'data-bg-style'].forEach(function (name) {
						body.setAttribute(name, root.getAttribute(name) || '');
					});
					body.style.colorScheme = root.style.colorScheme;
				} catch (_) {}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
